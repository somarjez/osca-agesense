name: keep-alive

# Phase E — see docs/DEPLOYMENT.md for the full writeup. Render's free tier
# has no persistent queue worker or scheduler, and sleeps the web service
# after ~15 min idle. This hits one protected Laravel endpoint every 10
# minutes during business hours (6am-8pm PHT = 22:00-23:59 + 00:00-11:59 UTC),
# which drains the queue, runs due scheduled tasks, and keeps the service warm
# as a side effect of the request itself — all in one HTTP call. Deliberately
# NOT 24/7: the workspace shares a 750 instance-hour/month pool across all 3
# free services, and this window alone already uses ~360 of those hours,
# leaving headroom for the 2 Python ML services' own on-demand wake-ups
# (never pinged here — MlService.php already handles their cold starts).

on:
  schedule:
    - cron: '*/10 0-11,22-23 * * *'
  workflow_dispatch: {}   # manual trigger, for testing

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  tick:
    name: tick
    runs-on: ubuntu-latest
    steps:
      # A sleeping Render web service takes 60-90s+ to cold-boot. Without
      # this, a cold start could eat most of the cron-tick request's own
      # budget below before Laravel even starts handling it, tripping
      # CronTickController's internal deadline (services.python.cron_budget,
      # 70s) or curl's own --max-time before real work ever ran. This ping
      # only needs the app to start responding, not to finish — 404 on /
      # is fine, a network failure/timeout is tolerated (|| true) since the
      # cron-tick request right after this is the one that must succeed.
      - name: Warm up the web service
        run: |
          curl --silent --show-error -o /dev/null -w "warm-up status: %{http_code}\n" \
            --connect-timeout 15 --max-time 90 \
            "https://pagsanjan-osca.online/" || true

      # CronTickController now bounds its own total runtime to
      # services.python.cron_budget (70s, see config/services.php), so a
      # single tick can no longer run past this --max-time on its own —
      # --retry covers the case where the warm-up above wasn't enough
      # (Render's cold start still landed on this request instead) rather
      # than a still-oversized drain.
      - name: Hit the cron-tick endpoint
        run: |
          curl --fail-with-body --show-error -X POST "https://pagsanjan-osca.online/api/internal/cron-tick" \
            -H "X-Cron-Token: ${{ secrets.CRON_TRIGGER_TOKEN }}" \
            --connect-timeout 15 \
            --max-time 85 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --write-out "\nHTTP status: %{http_code}\n"
