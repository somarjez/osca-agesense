; Production OPcache tuning — Task 4 (Render/Neon production review).
;
; The base image (richarvey/nginx-php-fpm:3.1.6) already turns OPcache ON by
; default: its Dockerfile copies php:8.2.7-fpm-alpine's php.ini-development
; template and sed's every `;opcache...`/`;zend_extension=opcache` line to
; uncomment it (verified directly against the Dockerfile at the exact 3.1.6
; git tag — see task-4-report.md). That leaves OPcache running, but on
; php.ini-development's stock values, none of which are production-tuned:
; opcache.memory_consumption=128, opcache.interned_strings_buffer=8,
; opcache.max_accelerated_files=10000, opcache.validate_timestamps=1
; (re-stats every file on disk every opcache.revalidate_freq=2s).
;
; This file is copied into /usr/local/etc/php/conf.d/ by the Dockerfile,
; which PHP scans and loads AFTER the main php.ini — so these values win
; over the base image's without patching php.ini directly.
;
; Values mirror Phase 2's local dev tuning (memory_consumption=256,
; interned_strings_buffer=16, max_accelerated_files=30000) with ONE
; deliberate difference: validate_timestamps=0, not local dev's 1. Code
; cannot change at runtime here — every deploy is a fresh container build
; (scripts/00-laravel-deploy.sh runs composer install + config/route/view
; cache once at container start, and the filesystem is otherwise immutable
; until the next deploy) — so paying a stat() call per included file per
; request buys nothing and is pure overhead. Local dev keeps
; validate_timestamps=1 because source files there DO change between
; requests during active development.
;
; memory_consumption=192, not the 256 this file originally shipped with:
; this app runs on Render's Hobby/free plan (see docs/DEPLOYMENT.md) — a
; single ~512MB instance shared with nginx, supervisord, and the whole
; PHP-FPM pool, not a dedicated box. 256MB (already double the base
; image's stock 128MB default) was an unmeasured guess against that
; shared ceiling and risked an OOM-kill — Render kills rather than swaps,
; so this fails hard, not gracefully. 192MB keeps most of the headroom
; over the 128MB stock value while leaving materially more slack for
; everything else on the instance. scripts/00-laravel-deploy.sh now
; echoes the effective opcache.* values to the deploy log at container
; start, so this (and any future change here) is verifiable in
; production instead of trusted on paper.
;
; max_accelerated_files=30000: this project's vendor/ alone is ~8,800 PHP
; files; app/config/database/resources/routes/tests add ~700 more, plus
; whatever view:cache's compiled Blade templates add on top — comfortably
; within reach of the base image's 10,000-file default, which would start
; silently evicting cached files (opcache.max_wasted_percentage churn) as
; the codebase grows. 30000 leaves real headroom.

[opcache]
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
opcache.validate_timestamps=0
