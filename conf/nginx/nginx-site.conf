server {
	listen   80; ## listen for ipv4; this line is default and implied
	listen   [::]:80 default ipv6only=on; ## listen for ipv6

	# Hardcoded directly (not left to the WEBROOT env var's sed patch): the
	# custom-config copy step in start.sh runs AFTER WEBROOT's sed already
	# executed on the base image's default file, so that patch never reaches
	# this file at all — it gets silently discarded the moment this file is
	# copied over it. Must bake the correct value in here directly.
	root /var/www/html/public;
	index index.php index.html index.htm;

	# Make site accessible from http://localhost/
	server_name _;

	# Disable sendfile as per https://docs.vagrantup.com/v2/synced-folders/virtualbox.html
	sendfile off;

	# Add stdout logging
	error_log /dev/stdout info;
	access_log /dev/stdout;

        # Add option for x-forward-for (real ip when behind elb)
        #real_ip_header X-Forwarded-For;
        #set_real_ip_from 172.16.0.0/12;

	# block access to sensitive information about git
	location /.git {
           deny all;
           return 403;
        }

	location / {
		# Hardcoded directly for the same reason as `root` above: the
		# PHP_CATCHALL env var's sed patch runs before this file replaces
		# the default config, so it never actually applies here. Route
		# everything with no matching file straight to Laravel's front
		# controller (the standard Laravel/Nginx front-controller pattern).
		try_files $uri $uri/ /index.php?$args;
	}

	error_page 404 /404.html;
        location = /404.html {
                root /var/www/errors;
                internal;
        }

        location ^~ /sad.svg {
            alias /var/www/errors/sad.svg;
            access_log off;
        }
        location ^~ /twitter.svg {
            alias /var/www/errors/twitter.svg;
            access_log off;
        }
        location ^~ /github.svg {
            alias /var/www/errors/github.svg;
            access_log off;
        }

	# pass the PHP scripts to FastCGI server listening on socket
	#
	location ~ \.php$ {
                try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass unix:/var/run/php-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    		fastcgi_param SCRIPT_NAME $fastcgi_script_name;
		fastcgi_index index.php;
		include fastcgi_params;
	}

        # Static assets: served directly from disk when the file exists (e.g.
        # everything under /build from the Vite bundle). Falls through to
        # index.php for anything matching these extensions with NO file on
        # disk — needed because Livewire serves its own JS runtime dynamically
        # at /livewire/livewire.js (a Laravel route, not a static file); without
        # this fallback that request 404s here before Laravel ever sees it,
        # since this location is more specific than "location /" and fully
        # claims the request. This mirrors the same try_files pattern the
        # PHP_CATCHALL env var already applies to "location /" above.
        location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg)$ {
                try_files $uri $uri/ /index.php?$args;
                expires           5d;
        }

	# deny access to . files, for security
	#
	location ~ /\. {
    		log_not_found off;
    		deny all;
	}

	location ^~ /.well-known {
                allow all;
                auth_basic off;
        }

}
