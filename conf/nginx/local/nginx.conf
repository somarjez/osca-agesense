# Local dev nginx config — AgeSense OSCA
#
# Replaces `php artisan serve` (PHP's built-in dev server) as the local web
# server. `artisan serve` is strictly single-request on Windows: it needs
# PHP_CLI_SERVER_WORKERS, which requires pcntl_fork(), which does not exist
# on Windows (PHP_OS_FAMILY=Windows). That meant a second sidebar click could
# not be served until the first request finished — the #1 reported "sidebar
# won't respond" symptom. This config fronts a pool of 4 persistent php-cgi
# FastCGI workers (started by start.ps1 / start-quiet.ps1) so up to 4
# requests are served concurrently, for real.
#
# Self-contained on purpose: mime.types and fastcgi_params are vendored
# alongside this file (copied from the Laragon nginx install this was
# authored against) rather than referenced via an absolute Laragon path or a
# bare relative include. nginx resolves relative `include` paths against the
# directory containing the file that references them (verified empirically:
# NOT against the -p prefix), so keeping copies next to this file makes the
# config work regardless of prefix, and independent of exactly which nginx
# install (Laragon or otherwise) start.ps1 ends up resolving.
#
# Invoked as:
#   nginx.exe -p "<project-root>" -c "<project-root>\conf\nginx\local\nginx.conf"
# All relative paths below (error_log, pid, access_log, temp dirs, root) are
# resolved against that -p prefix, i.e. the project root — verified with
# `nginx -t` during development of this file.
#
# Modeled on the production config at conf/nginx/nginx-site.conf (read for
# reference; not modified). The PHP location block below reuses its shape
# (try_files/fastcgi_pass/fastcgi_param/timeouts) rather than inventing a new
# one; the 90s fastcgi timeouts are copied verbatim so local dev reproduces
# the same ceiling bulk-import / batch-ML / GIS-geocode requests must fit
# inside in production (see nginx-site.conf's own comment for why 90s).

# Fixed at 1 (not "auto"): 4 concurrent requests are already handled by the
# 4-worker php-cgi pool below; nginx itself just proxies to it. "auto" would
# spawn one nginx worker per logical core, which on a many-core dev box
# balloons the process count for no benefit here and makes the "1 nginx
# master + 1 worker = 2 processes" acceptance check meaningless.
worker_processes 1;

# Written under storage/logs so all OSCA logs live in one place, not
# nginx's own default `logs/` directory under the install prefix.
error_log  storage/logs/nginx-error.log warn;
pid        storage/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  storage/logs/nginx-access.log;

    sendfile    on;
    keepalive_timeout 65;

    # nginx needs to be able to create these on every start (and `nginx -t`
    # checks they're creatable too) — start.ps1 pre-creates the parent dirs
    # before invoking nginx so this never fails on a clean checkout.
    client_body_temp_path storage/logs/nginx-temp/client_body;
    fastcgi_temp_path     storage/logs/nginx-temp/fastcgi;
    proxy_temp_path       storage/logs/nginx-temp/proxy;
    uwsgi_temp_path       storage/logs/nginx-temp/uwsgi;
    scgi_temp_path        storage/logs/nginx-temp/scgi;

    # The php-cgi worker pool started by start.ps1 / start-quiet.ps1: 4
    # persistent PHP_FCGI_MAX_REQUESTS=0 workers, one per port. This — not
    # JavaScript/Livewire — is the actual concurrency fix: up to 4 requests
    # now run in parallel instead of queueing behind a single-request dev
    # server.
    upstream osca_php_pool {
        server 127.0.0.1:9000;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
    }

    server {
        # Same host:port the app has always used locally — shortcuts,
        # launch-osca.vbs, and browser bookmarks all target this and none of
        # them need to change.
        listen 127.0.0.1:8000;
        server_name 127.0.0.1;

        root  public;
        index index.php;

        # Vite build output served directly from disk — never round-trips
        # through PHP. `^~` makes this take precedence over the regex-free
        # `location /` fallback below for anything under /build/.
        location ^~ /build/ {
            try_files $uri =404;
            expires 5d;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Deny access to dotfiles (.env, .git, etc.) served from the docroot.
        location ~ /\. {
            deny all;
        }

        location ~ \.php$ {
            fastcgi_pass osca_php_pool;
            include      fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Copied verbatim from conf/nginx/nginx-site.conf (production):
            # local dev must reproduce the same ceiling the bulk-import /
            # batch-ML / GIS-geocode requests have to fit inside in prod.
            fastcgi_read_timeout 90s;
            fastcgi_send_timeout 90s;
        }
    }
}
