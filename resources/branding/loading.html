<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgeSense — Starting…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg-base: #07142d;
    --bg-secondary: #10254a;
    --card-bg: rgba(13, 33, 67, .76);
    --card-border: rgba(96, 165, 250, .32);
    --blue-1: #2563eb;
    --blue-2: #38bdf8;
    --blue-3: #93c5fd;
    --blue-accent: #60a5fa;
    --text-muted: #9db3d6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden; /* the page must never scroll */
    font-family: 'Plus Jakarta Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 640px at 50% 34%, rgba(37, 99, 235, .24), transparent 62%),
      linear-gradient(160deg, var(--bg-secondary), var(--bg-base) 62%);
    color: #f4f8ff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 16px;
  }

  /* ── Decorative background (rings + dots) — purely cosmetic ───────────── */
  .decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .decor .ring-lg {
    position: absolute;
    border: 1px solid rgba(96, 165, 250, .08);
    border-radius: 50%;
  }
  .decor .ring-lg.r1 { width: 920px; height: 920px; top: -300px; left: -260px; }
  .decor .ring-lg.r2 { width: 680px; height: 680px; bottom: -320px; right: -180px; }
  .decor .ring-lg.r3 { width: 460px; height: 460px; top: 58%; left: 46%; border-color: rgba(96, 165, 250, .05); }
  .decor .dot-grid {
    position: absolute;
    width: 110px; height: 74px;
    background-image: radial-gradient(rgba(148, 163, 184, .38) 1px, transparent 1.6px);
    background-size: 18px 18px;
    opacity: .45;
  }
  .decor .dot-grid.top-left { top: 12%; left: 7%; }
  .decor .dot-grid.bottom-right { bottom: 10%; right: 8%; }
  .decor .dot {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(96, 165, 250, .55);
    box-shadow: 0 0 10px 2px rgba(96, 165, 250, .45);
  }
  .decor .dot.d1 { top: 41%; left: 18%; }
  .decor .dot.d2 { top: 73%; right: 22%; }
  .decor .dot.d3 { top: 22%; right: 12%; width: 4px; height: 4px; }

  /* ── Glass card ─────────────────────────────────────────────────────── */
  .card {
    position: relative;
    z-index: 1;
    width: calc(100% - 32px);
    max-width: 680px;
    border-radius: 24px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    padding: 48px 56px;
    text-align: center;
  }
  .card.is-ready { animation: readyPulse .55s ease; }
  @keyframes readyPulse {
    0%   { box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
    50%  { box-shadow: 0 24px 80px rgba(0, 0, 0, .35), 0 0 0 6px rgba(56, 189, 248, .22); }
    100% { box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
  }

  /* ── Logo + rotating ring loader ───────────────────────────────────── */
  .loader {
    position: relative;
    width: 128px; height: 128px;
    margin: 0 auto 28px;
  }
  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 3px solid rgba(96, 165, 250, .16);
    border-top-color: var(--blue-accent);
    border-right-color: rgba(96, 165, 250, .5);
    box-shadow: 0 0 26px rgba(56, 189, 248, .3);
    animation: spin 1.6s linear infinite;
  }
  .ring::after {
    content: "";
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: var(--blue-3);
    box-shadow: 0 0 14px 4px rgba(147, 197, 253, .85);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-tile {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 88px; height: 88px;
    border-radius: 20px;
    background: #16213a;
    border: 1px solid rgba(255, 255, 255, .08);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-tile svg { width: 48px; height: 48px; }
  [data-phase="failed"] .loader { opacity: .5; }
  [data-phase="failed"] .ring,
  [data-phase="ready"] .ring,
  [data-phase="ready"] .ring::after { animation-play-state: paused; }

  /* ── Heading / description ─────────────────────────────────────────── */
  h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -.01em;
    color: #ffffff;
    margin: 0 0 .55rem;
  }
  p.sub {
    font-size: .98rem;
    color: var(--text-muted);
    margin: 0 auto 1.9rem;
    max-width: 30rem;
    line-height: 1.55;
  }

  /* ── Progress bar ───────────────────────────────────────────────────── */
  .progress-track {
    position: relative;
    height: 8px;
    border-radius: 999px;
    background: rgba(148, 163, 184, .15);
    overflow: hidden;
    margin: 0 0 1.6rem;
  }
  .progress-fill {
    position: absolute;
    top: 0; left: -40%;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue-1), var(--blue-2), var(--blue-3));
    box-shadow: 0 0 14px rgba(56, 189, 248, .6);
    animation: indeterminate 1.7s ease-in-out infinite;
  }
  @keyframes indeterminate {
    0%   { left: -40%; }
    100% { left: 100%; }
  }
  [data-phase="failed"] .progress-fill,
  [data-phase="ready"] .progress-fill { animation-play-state: paused; opacity: .55; }

  /* ── Status row ─────────────────────────────────────────────────────── */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    font-size: .86rem;
    color: var(--text-muted);
    min-height: 1.3em;
  }
  .status-row svg { flex-shrink: 0; }

  /* ── Retry button ───────────────────────────────────────────────────── */
  .retry-btn {
    display: none;
    margin: 1.5rem auto 0;
    background: linear-gradient(180deg, #3b74f0, var(--blue-1));
    color: #ffffff;
    border: none;
    padding: .68rem 1.9rem;
    border-radius: 10px;
    font-size: .92rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    min-height: 44px; /* keep the tap target comfortable on touch screens */
    transition: background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .retry-btn:hover:not(:disabled) { background: linear-gradient(180deg, #4c81f2, #1f4a92); }
  .retry-btn:active:not(:disabled) { transform: translateY(1px); }
  .retry-btn:focus-visible {
    outline: 2px solid var(--blue-3);
    outline-offset: 3px;
  }
  .retry-btn:disabled { opacity: .55; cursor: default; }
  [data-phase="slow"] .retry-btn,
  [data-phase="failed"] .retry-btn { display: inline-flex; align-items: center; justify-content: center; }

  /* ── Footer ─────────────────────────────────────────────────────────── */
  .divider {
    border: none;
    border-top: 1px solid rgba(148, 163, 184, .18);
    margin: 1.9rem 0 1.25rem;
  }
  .footer-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    font-size: .82rem;
    color: var(--text-muted);
  }
  .footer-note svg { flex-shrink: 0; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Responsive ─────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .card { padding: 32px 22px; border-radius: 20px; }
    h1 { font-size: 1.45rem; }
    p.sub { font-size: .9rem; }
    .loader { width: 104px; height: 104px; margin-bottom: 22px; }
    .logo-tile { width: 72px; height: 72px; border-radius: 16px; }
    .logo-tile svg { width: 38px; height: 38px; }
    .decor .ring-lg, .decor .dot-grid { display: none; }
  }

  /* ── Reduced motion ─────────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    .ring, .ring::after { animation: none; }
    .progress-fill { animation: none; left: 20%; width: 55%; }
    .card.is-ready { animation: none; }
  }
</style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <div class="ring-lg r1"></div>
    <div class="ring-lg r2"></div>
    <div class="ring-lg r3"></div>
    <div class="dot-grid top-left"></div>
    <div class="dot-grid bottom-right"></div>
    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
  </div>

  <div class="card" id="card" data-phase="normal">
    <div class="loader" role="img" aria-label="Loading">
      <div class="ring" aria-hidden="true"></div>
      <div class="logo-tile" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 8.4 L12 31.6" stroke="#fbfaf6" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M20 8.4 L28 31.6" stroke="#fbfaf6" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M14.7 24.3 L25.3 24.3" stroke="#5689d6" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div role="status" aria-live="polite">
      <h1 id="heading">Preparing AgeSense</h1>
      <p class="sub" id="description">Securely connecting system services and preparing your workspace.</p>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>

    <div class="status-row" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span id="statusPrefix">Initializing analytics service</span><span id="secondsWrap" aria-hidden="true"> &middot; <span id="statusSeconds">1 second</span></span>
    </div>

    <button type="button" class="retry-btn" id="retryBtn">Try Again</button>

    <hr class="divider">
    <div class="footer-note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>The first launch may take up to 30 seconds. Please keep this tab open.</span>
    </div>
  </div>

  <noscript>
    <p style="position:relative;z-index:1;color:#fff;text-align:center;padding:1rem 1.5rem;">
      JavaScript is required to start AgeSense. Please enable it and refresh, or open
      <a href="http://127.0.0.1:8000" style="color:#93c5fd;">http://127.0.0.1:8000</a> directly.
    </p>
  </noscript>

<script>
(function () {
  'use strict';

  var TARGET          = 'http://127.0.0.1:8000';
  var SLOW_THRESHOLD   = 30; // seconds before "taking longer than expected" messaging
  var MAX_ATTEMPTS     = 60; // ~60s at 1s interval before giving up
  var POLL_INTERVAL_MS = 1000;
  var FIRST_TICK_MS    = 800;

  var card        = document.getElementById('card');
  var heading     = document.getElementById('heading');
  var description = document.getElementById('description');
  var statusPrefix = document.getElementById('statusPrefix');
  var secondsWrap  = document.getElementById('secondsWrap');
  var statusSeconds = document.getElementById('statusSeconds');
  var retryBtn     = document.getElementById('retryBtn');

  var state = {
    phase: 'normal',
    elapsed: 0,
    attempts: 0,
    timerId: null,
    controller: null,
    epoch: 0 // bumped on every retry so stale in-flight fetches from a prior cycle can be ignored
  };

  function updateSecondsDisplay() {
    statusSeconds.textContent = state.elapsed + ' second' + (state.elapsed === 1 ? '' : 's');
  }

  function setPhase(phase) {
    if (state.phase === phase) return;
    state.phase = phase;
    card.setAttribute('data-phase', phase);
    card.classList.remove('is-ready');

    if (phase === 'normal') {
      heading.textContent = 'Preparing AgeSense';
      description.textContent = 'Securely connecting system services and preparing your workspace.';
      statusPrefix.textContent = 'Initializing analytics service';
      secondsWrap.hidden = false;
      document.title = 'AgeSense — Starting…';
    } else if (phase === 'slow') {
      heading.textContent = 'AgeSense is taking longer than expected';
      description.textContent = 'The service may still be waking up. You may continue waiting or try again.';
      document.title = 'AgeSense — Still Starting…';
    } else if (phase === 'failed') {
      heading.textContent = 'Unable to start AgeSense';
      description.textContent = 'The system service could not be reached. Check your connection and try again.';
      statusPrefix.textContent = 'Connection unavailable';
      secondsWrap.hidden = true;
      document.title = 'AgeSense — Unable to Start';
    } else if (phase === 'ready') {
      statusPrefix.textContent = 'AgeSense is ready';
      secondsWrap.hidden = true;
      document.title = 'AgeSense — Ready';
      // Force reflow so the class re-triggers the pulse animation on repeat runs.
      void card.offsetWidth;
      card.classList.add('is-ready');
    }
  }

  function stopLoop() {
    if (state.timerId) { clearTimeout(state.timerId); state.timerId = null; }
    if (state.controller) {
      try { state.controller.abort(); } catch (e) { /* no-op */ }
      state.controller = null;
    }
  }

  function loopStep() {
    state.elapsed++;
    updateSecondsDisplay();
    if (state.phase === 'normal' && state.elapsed >= SLOW_THRESHOLD) {
      setPhase('slow');
    }
    probe();
  }

  function probe() {
    state.attempts++;

    // Snapshot the current epoch. A retry bumps state.epoch and this closure
    // uses it to recognize itself as stale — this matters because
    // controller.abort() can't reliably stop a fetch that has already begun
    // rejecting on its own (e.g. an immediate ECONNREFUSED): the abort call
    // may lose that race and the promise settles with a normal error rather
    // than an AbortError. Without this guard, that stale settlement would
    // still touch the (already-reset) shared state and could double count
    // attempts or flip the phase using data from a cycle that no longer exists.
    var epoch = state.epoch;

    var controller = ('AbortController' in window) ? new AbortController() : null;
    state.controller = controller;

    var opts = { mode: 'no-cors', cache: 'no-store' };
    if (controller) opts.signal = controller.signal;

    fetch(TARGET, opts).then(function () {
      if (epoch !== state.epoch) return; // stale — a retry has already superseded this cycle
      // A response (even opaque, due to no-cors) means the server is up.
      onReady();
    }).catch(function (err) {
      if (epoch !== state.epoch) return; // stale — a retry has already superseded this cycle
      if (err && err.name === 'AbortError') return; // intentional abort (retry/unload) — not a real failure
      if (state.attempts >= MAX_ATTEMPTS) {
        onGiveUp();
      } else {
        state.timerId = setTimeout(loopStep, POLL_INTERVAL_MS);
      }
    });
  }

  function onReady() {
    stopLoop();
    setPhase('ready');
    // Brief pause so the "ready" state is visible before handing off — not a
    // multi-second artificial wait, just enough for the pulse to register.
    setTimeout(function () { location.replace(TARGET); }, 450);
  }

  function onGiveUp() {
    stopLoop();
    setPhase('failed');
  }

  function retry() {
    if (retryBtn.disabled) return; // guards against duplicate retry requests
    retryBtn.disabled = true;

    stopLoop();
    state.epoch++; // invalidate any still-settling fetch from the previous cycle
    state.elapsed = 0;
    state.attempts = 0;
    setPhase('normal');
    updateSecondsDisplay();
    state.timerId = setTimeout(loopStep, FIRST_TICK_MS);

    // Re-enable once the new cycle is safely underway.
    setTimeout(function () { retryBtn.disabled = false; }, 1000);
  }

  retryBtn.addEventListener('click', retry);

  window.addEventListener('pagehide', stopLoop);
  window.addEventListener('beforeunload', stopLoop);

  updateSecondsDisplay();
  state.timerId = setTimeout(loopStep, FIRST_TICK_MS);
})();
</script>
</body>
</html>
